<g font-family="Arial,sans-serif">
<text x="60" y="75" font-size="24" font-weight="600" fill="#102b50">Desktop · Room to spread out</text>
<g transform="translate(65 110)" stroke="#0052cc" stroke-width="3" fill="none"><rect x="10" y="0" width="150" height="45" rx="9"/><rect x="20" y="20" width="60.0" height="25" rx="5"/><rect x="90.0" y="20" width="60.0" height="25" rx="5"/><rect y="43" width="170" height="30" rx="5"/><path d="M8 73 V84 H22 V73 M148 73 V84 H162 V73"/></g>
<text x="270" y="151" font-size="20" fill="#6b6b6b">Same furniture. A wider arrangement.</text>
<rect x="65" y="250" width="870" height="450" rx="14" fill="#e9edf3" stroke="#bdc9d9"/><path d="M65 285 H935" stroke="#bdc9d9"/><circle cx="86" cy="268" r="4" fill="#91a2b9"/><circle cx="102" cy="268" r="4" fill="#91a2b9"/>
<rect x="210" y="365" width="580" height="235" rx="14" fill="white"/>
