<title id="title">AI-enabled workflow: drafts, review, and continuous improvement</title>
<desc id="desc">Shared system context supports a brief, AI composition, design review, code generation, automated checks, PR review, and release. Failed checks return to code generation; recurring gaps improve the system. Code Connect and expanded automated checks are planned.</desc>
